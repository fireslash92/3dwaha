<title>أسرار عين الوادي</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: full-bleed canvas world; HUD floats on safe-area-aware edges; one warm dusk look */
:root{
  --ink:#2a1c12;
  --parchment:#f8eed9;
  --parchment-2:#edd9b2;
  --amber:#e8a94a;
  --terracotta:#a9472a;
  --dusk:rgba(28,19,12,.8);
  --line:#6b4a2b;
  --font-display:"Reem Kufi","SF Arabic","Geeza Pro","Noto Kufi Arabic",system-ui,sans-serif;
  --font-body:system-ui,-apple-system,"SF Arabic","Geeza Pro","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  margin:0;background:#22301a;color:var(--ink);font-family:var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;background:#22301a}
#game *{touch-action:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#fade{position:absolute;inset:0;z-index:9;background:#0e0905;opacity:0;pointer-events:none;transition:opacity .24s}
#fade.on{opacity:1}

/* ---------- joystick ---------- */
#stickZone{position:absolute;left:0;bottom:0;width:46%;height:62%;z-index:5}
#stickBase{
  position:absolute;left:0;top:0;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,244,222,.08) 0 54%,rgba(255,244,222,.2) 55% 100%);
  border:2px solid rgba(255,238,205,.6);
  box-shadow:0 6px 18px rgba(0,0,0,.28),inset 0 0 0 6px rgba(50,30,12,.14);
  transition:opacity .25s;
}
#stickBase.returning{transition:transform .18s ease-out,opacity .25s}
#stickKnob{
  position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#fff7e6,#ecca8e 58%,#c08d4b);
  box-shadow:0 3px 8px rgba(0,0,0,.38),inset 0 -3px 0 rgba(120,70,20,.25);
}
#game.talking #stickBase,#game.title #stickBase{opacity:.28}

/* ---------- interact button ---------- */
#actBtn{
  position:absolute;z-index:6;
  right:calc(env(safe-area-inset-right,0px) + 26px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  width:88px;height:88px;border-radius:50%;padding:0;
  font:700 19px/1 var(--font-display);color:#fff4df;
  background:radial-gradient(circle at 40% 30%,#c9693f,#8f3a1f 72%);
  border:3px solid #f0cf94;box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 -4px 0 rgba(60,15,5,.35);
  opacity:.5;transition:opacity .2s,transform .08s;
}
#actBtn.ready{opacity:1;animation:ready 1.3s ease-in-out infinite}
#actBtn.down{transform:scale(.93)}
#actBtn:focus-visible,#dlgNext:focus-visible,#startBtn:focus-visible,#chapterBtn:focus-visible{outline:3px solid #fff3d6;outline-offset:3px}
@keyframes ready{0%,100%{box-shadow:0 6px 16px rgba(0,0,0,.35),0 0 0 0 rgba(240,207,148,.55),inset 0 -4px 0 rgba(60,15,5,.35)}50%{box-shadow:0 6px 16px rgba(0,0,0,.35),0 0 0 10px rgba(240,207,148,0),inset 0 -4px 0 rgba(60,15,5,.35)}}

/* ---------- quest chip ---------- */
#topRight{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
#topRight>*{pointer-events:auto}
#mini{display:block;width:120px;height:92px;border-radius:12px;border:2px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.35);background:#2c3f22;transition:width .2s,height .2s}
#mini.big{width:220px;height:168px}
#game.title #topRight,#game.battling #topRight,#game.hide-mini #mini{display:none}
#hud{
  display:flex;align-items:center;gap:6px;padding:6px 14px 6px 12px;border-radius:999px;
  background:linear-gradient(180deg,var(--parchment),var(--parchment-2));border:2px solid var(--line);
  box-shadow:0 4px 12px rgba(0,0,0,.3);font:700 14px/1.5 var(--font-display);color:var(--ink);
}
#hud b{font-variant-numeric:tabular-nums;color:var(--terracotta)}
#hud.done{background:linear-gradient(180deg,#fff1c9,#f2cf7c)}
#hud.bump{animation:bump .5s ease-out}
@keyframes bump{40%{transform:scale(1.12)}}

/* ---------- toast ---------- */
#toast{
  position:absolute;z-index:7;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);
  transform:translate(-50%,-8px);max-width:min(70vw,520px);
  padding:10px 20px;border-radius:999px;background:var(--dusk);color:#fbeed4;
  border:1px solid rgba(232,169,74,.65);box-shadow:0 6px 20px rgba(0,0,0,.3);
  font:600 15px/1.7 var(--font-body);text-align:center;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast small{display:block;font-weight:500;font-size:12.5px;opacity:.8}
@media (orientation:portrait){#toast{top:calc(env(safe-area-inset-top,0px) + 58px);max-width:88vw;border-radius:18px}}

/* ---------- dialog ---------- */
#dialog{
  position:absolute;z-index:8;
  left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 168px);
  max-width:620px;margin-inline:auto;
  display:flex;gap:14px;align-items:flex-start;padding:14px 16px 12px;
  background:linear-gradient(180deg,var(--parchment),var(--parchment-2));
  border:2px solid var(--line);border-radius:16px;
  box-shadow:inset 0 0 0 3px var(--parchment),inset 0 0 0 4px #c9a46a,0 12px 30px rgba(20,10,0,.45);
  animation:dlgIn .22s ease-out;
}
@keyframes dlgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.portrait{
  flex:0 0 auto;width:66px;height:66px;border-radius:14px;overflow:hidden;
  border:2px solid var(--line);background:#e9cf9c;box-shadow:inset 0 0 0 2px #fff3dc;
}
#portrait{width:100%;height:100%;display:block}
.dlg-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.name{
  align-self:flex-start;font:700 15px/1.5 var(--font-display);color:#fff6e5;
  background:var(--terracotta);padding:1px 14px 2px;border-radius:999px;
}
#dlgText{margin:0;font:500 17px/1.95 var(--font-body);color:var(--ink);min-height:3.9em;text-wrap:pretty}
.dlg-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
#dlgDots{display:flex;gap:5px}
#dlgDots i{width:7px;height:7px;border-radius:50%;background:#cdb489;display:block}
#dlgDots i.on{background:var(--terracotta)}
#dlgNext{
  font:700 16px/1 var(--font-display);color:#fff4df;min-width:96px;min-height:44px;padding:0 18px;
  border-radius:12px;border:2px solid #5a3a1e;background:linear-gradient(180deg,#8a5a31,#6a4122);
  box-shadow:0 3px 0 #4a2c14;
}
#dlgNext:active{transform:translateY(2px);box-shadow:0 1px 0 #4a2c14}

/* ---------- title & chapter screens ---------- */
.overlay{
  position:absolute;inset:0;z-index:10;display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse at 50% 45%,rgba(30,18,8,.25),rgba(22,14,6,.74));
  transition:opacity .5s;
}
.overlay.leaving{opacity:0;pointer-events:none}
#chapter{background:radial-gradient(ellipse at 50% 45%,rgba(30,18,8,.55),rgba(14,9,4,.88));animation:fadeIn .8s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.title-card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:520px}
.eyebrow{margin:0;font:600 13px/1.6 var(--font-body);color:#f2cf8e;letter-spacing:.06em}
.overlay h1,.overlay h2{
  margin:0;font:700 clamp(38px,8.5vw,64px)/1.25 var(--font-display);color:#fff2d8;text-wrap:balance;
  text-shadow:0 2px 0 #7a3a1c,0 6px 22px rgba(0,0,0,.55);
}
.overlay h2{font-size:clamp(30px,7vw,50px)}
.tag{margin:0 0 6px;font:500 16px/1.8 var(--font-body);color:#f6e6c6;text-wrap:balance;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.big-btn{
  font:700 20px/1 var(--font-display);color:#3a210c;padding:16px 38px;border-radius:999px;
  border:2px solid #fff0cc;background:linear-gradient(180deg,#ffd88a,#e8a94a);
  box-shadow:0 5px 0 #a8692a,0 12px 26px rgba(0,0,0,.4);
}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a8692a,0 8px 18px rgba(0,0,0,.4)}
.rotate-tip{display:none;margin:4px 0 0;font:500 13px/1.6 var(--font-body);color:#e9d6b0;opacity:.85}
@media (orientation:portrait){.rotate-tip{display:block}}

/* ---------- menu button ---------- */
#menuBtn{
  position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);
  display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 14px;border-radius:999px;
  background:linear-gradient(180deg,var(--parchment),var(--parchment-2));border:2px solid var(--line);
  box-shadow:0 4px 12px rgba(0,0,0,.3);font:700 15px/1 var(--font-display);color:var(--ink);
}
#menuBtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
#menuBtn .dot{position:absolute;top:-4px;left:-4px;width:14px;height:14px;border-radius:50%;background:#d8443a;border:2px solid #fff3dc}
#game.title #menuBtn{display:none}
#menuBtn:focus-visible,.menu-panel button:focus-visible{outline:3px solid #2f6fa8;outline-offset:2px}

/* ---------- main menu ---------- */
#menu{
  position:absolute;inset:0;z-index:11;display:grid;place-items:center;background:rgba(16,10,5,.74);
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 10px);
  animation:fadeIn .18s ease-out;
}
.menu-panel{
  width:min(100%,960px);height:100%;max-height:640px;display:grid;
  grid-template-columns:172px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);
  background:linear-gradient(180deg,var(--parchment),var(--parchment-2));border:2px solid var(--line);border-radius:18px;
  box-shadow:inset 0 0 0 4px var(--parchment),inset 0 0 0 5px #c9a46a,0 20px 50px rgba(0,0,0,.5);overflow:hidden;
}
.menu-head{
  grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:10px 14px;min-width:0;
  background:linear-gradient(180deg,#5d3c1f,#3f270f);color:#fbeed4;border-bottom:3px solid #c9a46a;
}
#heroFace{flex:0 0 auto;width:54px;height:54px;border-radius:50%;border:2px solid #e8c88c;background:#e9cf9c}
.who{flex:0 0 auto;display:flex;flex-direction:column;gap:2px}
.who .hname{font:700 19px/1.2 var(--font-display)}
.who .htitle{font:500 12.5px/1.4 var(--font-body);color:#e9cf9c}
.who .lvl{font:700 13px/1.4 var(--font-display);color:#ffd88a}
.bars{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 12px}
.bar{display:flex;flex-direction:column;gap:3px;min-width:0}
.bar span{display:flex;justify-content:space-between;gap:6px;font:600 12px/1.3 var(--font-body);color:#f2dfbd;font-variant-numeric:tabular-nums}
.bar i{display:block;height:8px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden}
.bar i b{display:block;height:100%;border-radius:99px}
.bar.hp b{background:linear-gradient(90deg,#d8443a,#f0785e)}
.bar.mp b{background:linear-gradient(90deg,#2f6fa8,#5fa0dc)}
.bar.xp b{background:linear-gradient(90deg,#d99a2b,#ffd36b)}
#menuClose{
  flex:0 0 auto;min-width:44px;min-height:44px;padding:0 14px;border-radius:12px;border:2px solid #c9a46a;
  background:rgba(255,240,210,.12);color:#fbeed4;font:700 15px/1 var(--font-display);
}
.menu-tabs{display:flex;flex-direction:column;gap:4px;padding:10px;border-inline-end:2px solid #d8bf8f;background:rgba(201,164,106,.18);overflow:auto}
.menu-tabs button{
  display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:transparent;
  font:700 15px/1.2 var(--font-display);color:var(--ink);text-align:start;
}
.menu-tabs button svg{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu-tabs button[aria-selected="true"]{background:var(--terracotta);color:#fff4df;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.menu-body{overflow:auto;padding:16px 18px 20px;font:500 15px/1.7 var(--font-body);color:var(--ink);min-width:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#game .scroll,#game .scroll *{touch-action:pan-y}
#game .tabs-scroll,#game .tabs-scroll *{touch-action:pan-x}
.menu-body h3{margin:0 0 10px;font:700 18px/1.4 var(--font-display);color:#5a3a1e;text-wrap:balance}
.menu-body h4{margin:14px 0 6px;font:700 15px/1.4 var(--font-display);color:#7a4a26}
.menu-body p{margin:0 0 8px}
.muted{color:#7a6248;font-size:13.5px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.list{display:flex;flex-direction:column;gap:6px}
.row{
  display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 10px;border-radius:12px;
  background:rgba(255,250,238,.7);border:1.5px solid #d8bf8f;text-align:start;font:inherit;color:inherit;width:100%;
}
button.row{cursor:pointer}
.row.sel{border-color:var(--terracotta);box-shadow:0 0 0 2px rgba(169,71,42,.25);background:#fff7e8}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.row .lbl{font:600 12px/1.3 var(--font-body);color:#8a6a48}
.row .val{font:700 15px/1.4 var(--font-display);color:var(--ink)}
.row .val.empty{color:#a78a66;font-weight:500}
.ic{flex:0 0 auto;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#ead3a6;border:1.5px solid #c9a46a}
.ic svg{width:24px;height:24px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.chip{font:600 12px/1.5 var(--font-body);padding:0 7px;border-radius:99px;background:#efdcb6;color:#5a3a1e;font-variant-numeric:tabular-nums}
.chip.up{background:#d9ecd0;color:#245a2c}
.chip.down{background:#f4d3cc;color:#8c2a1c}
.tag-eq{font:700 11.5px/1.5 var(--font-display);padding:0 8px;border-radius:99px;background:var(--terracotta);color:#fff4df}
.btn{
  min-height:40px;padding:0 14px;border-radius:10px;border:2px solid #5a3a1e;background:linear-gradient(180deg,#8a5a31,#6a4122);
  color:#fff4df;font:700 14px/1 var(--font-display);box-shadow:0 2px 0 #4a2c14;flex:0 0 auto;
}
.btn.ghost{background:transparent;color:#5a3a1e;box-shadow:none}
.btn.warn{background:linear-gradient(180deg,#b84a32,#8f3420);border-color:#6b2414}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(255,250,238,.7);border:1.5px solid #d8bf8f}
.stat .n{flex:1;min-width:0}
.stat .n b{display:block;font:700 15px/1.3 var(--font-display)}
.stat .n small{display:block;font:500 12px/1.4 var(--font-body);color:#7a6248}
.stat .v{font:700 22px/1 var(--font-display);font-variant-numeric:tabular-nums;color:#5a3a1e}
.stat .v em{font:600 12px/1 var(--font-body);font-style:normal;color:#2f7d3a;margin-inline-start:4px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.skill{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,250,238,.75);border:1.5px solid #d8bf8f}
.skill.locked{opacity:.6;background:rgba(220,200,160,.35)}
.beast .pic{flex:0 0 auto;width:72px;height:56px;border-radius:10px;background:#3c4a2c;object-fit:contain;display:grid;place-items:center;font:700 22px/1 var(--font-display);color:#e9dcc5}
.beast .pic.unk{background:#8a7a62}
.skill .grow{flex:1;min-width:0}
.skill b{font:700 15px/1.4 var(--font-display)}
.skill .meta{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 4px}
.check{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.check li{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:rgba(255,250,238,.7);border:1.5px solid #d8bf8f;list-style:none;min-width:0}
.check li .grow{min-width:0}
.check li i{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid #c9a46a;font-style:normal;font-weight:700;color:#fff}
.check li.done i{background:#3f7f45;border-color:#2f6334}
.check ul,ul.check{margin:0;padding:0}
.quest{padding:12px 14px;border-radius:14px;background:rgba(255,250,238,.75);border:1.5px solid #d8bf8f;margin-bottom:10px}
.quest.done{opacity:.75}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 12px;border-bottom:1.5px dashed #d8bf8f}
.set .grow{flex:1;min-width:160px}
.seg{display:flex;border:2px solid #5a3a1e;border-radius:12px;overflow:hidden}
.seg button{min-height:40px;min-width:76px;padding:0 12px;border:0;background:transparent;font:700 14px/1 var(--font-display);color:#5a3a1e}
.seg button+button{border-inline-start:2px solid #5a3a1e}
.seg button[aria-pressed="true"]{background:#5a3a1e;color:#fff4df}
.actions{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:700px),(orientation:portrait){
  .menu-panel{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);max-height:none}
  .menu-tabs{flex-direction:row;border-inline-end:0;border-bottom:2px solid #d8bf8f;overflow-x:auto;overflow-y:hidden;padding:8px}
  .menu-tabs button{flex:0 0 auto}
  .bars{grid-template-columns:minmax(0,1fr);gap:3px}
  .menu-head{flex-wrap:wrap}
  .menu-head .bars{order:3;flex-basis:100%}
  .two,.stats,.check{grid-template-columns:minmax(0,1fr)}
}
@media (orientation:landscape) and (max-height:520px){
  .menu-panel{max-height:100%;grid-template-columns:150px minmax(0,1fr)}
  .menu-head{padding:6px 12px;gap:10px}
  #heroFace{width:42px;height:42px}
  .who .hname{font-size:16px}
  .menu-tabs button{min-height:40px;font-size:14px}
  .menu-body{padding:12px 14px 16px}
}

/* ---------- shop ---------- */
#shop{position:absolute;inset:0;z-index:11;display:grid;place-items:center;background:rgba(16,10,5,.74);
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 10px);animation:fadeIn .18s ease-out}
.shop-panel{width:min(100%,760px);height:100%;max-height:620px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--parchment),var(--parchment-2));border:2px solid var(--line);border-radius:18px;
  box-shadow:inset 0 0 0 4px var(--parchment),inset 0 0 0 5px #c9a46a,0 20px 50px rgba(0,0,0,.5);overflow:hidden}
.shop-panel .menu-body{flex:1}
.shop-panel .who{flex:1;min-width:0}
.shop-tabs{display:flex;gap:6px;padding:8px 12px;border-bottom:2px solid #d8bf8f;background:rgba(201,164,106,.18);overflow-x:auto}
.shop-tabs button{min-height:40px;padding:0 18px;border-radius:12px;border:0;background:transparent;font:700 15px/1 var(--font-display);color:var(--ink)}
.shop-tabs button[aria-selected="true"]{background:var(--terracotta);color:#fff4df}

<script>
(() => {
'use strict';
// ---- src/core/helpers.js ----
// أدوات عامة: ثوابت، أرقام عربية، دوال رسم أساسية

/* =========================================================
   Core constants & helpers
   ========================================================= */
const SPEED=118, HERO_R=7, NPC_R=8, TALK_RANGE=50, TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function ell(g,x,y,rx,ry){g.beginPath();g.ellipse(x,y,rx,ry,0,0,TAU);}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}
function poly(g,p){g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();g.fill();}
function softShadow(g,x,y,rx,ry,a){g.save();g.translate(x,y);g.scale(1,ry/rx);const gr=g.createRadialGradient(0,0,0,0,0,rx);gr.addColorStop(0,`rgba(28,30,12,${a})`);gr.addColorStop(.6,`rgba(28,30,12,${a*.6})`);gr.addColorStop(1,'rgba(28,30,12,0)');g.fillStyle=gr;g.fillRect(-rx,-rx,rx*2,rx*2);g.restore();}

// ---- src/world/village-map.js ----
// خريطة القرية: الطرق والبيوت والأشجار والتصادم

/* =========================================================
   VILLAGE MAP (pure data + queries)
   ========================================================= */
const VW=1152, VH=864;
const MAP=(()=>{
  const R=mulberry(20261108);
  const plaza={x:576,y:440,rx:150,ry:118}, lookout={x:576,y:722,r:46};
  const paths=[
    {pts:[[576,-20],[576,340]],w:60},
    {pts:[[576,540],[576,722]],w:56},
    {pts:[[440,446],[226,446],[226,300]],w:52},
    {pts:[[226,446],[228,700]],w:52},
    {pts:[[712,446],[924,446],[924,306]],w:52},
    {pts:[[864,446],[864,604]],w:36},
    {pts:[[924,446],[1170,446]],w:48},
  ];
  function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);const qx=ax+t*dx-px,qy=ay+t*dy-py;return Math.sqrt(qx*qx+qy*qy);}
  function onRoad(x,y,m=0){for(const p of paths)for(let i=0;i<p.pts.length-1;i++){const a=p.pts[i],b=p.pts[i+1];if(distSeg(x,y,a[0],a[1],b[0],b[1])<p.w/2+m)return true;}return false;}
  function onPlaza(x,y,m=0){const dx=(x-plaza.x)/(plaza.rx+m),dy=(y-plaza.y)/(plaza.ry+m);return dx*dx+dy*dy<1;}
  function onLookout(x,y,m=0){return Math.hypot(x-lookout.x,y-lookout.y)<lookout.r+m;}
  const onAnyPath=(x,y,m=0)=>onRoad(x,y,m)||onPlaza(x,y,m)||onLookout(x,y,m);

  const houses=[
    {id:'A',x:126,w:200,base:300,wallH:82,roofH:76,door:.5,roof:['#d0693f','#a5432a'],trim:'#4f7b6a'},
    {id:'B',x:824,w:200,base:306,wallH:82,roofH:78,door:.5,roof:['#d77a49','#ad4f2e'],trim:'#6c5b8c'},
    {id:'C',x:136,w:184,base:700,wallH:78,roofH:72,door:.5,roof:['#c75e3a','#9c3f26'],trim:'#3f6f86'},
  ];
  houses.forEach(h=>h.doorX=Math.round(h.x+h.w*h.door));

  const trees=[];
  const T=(x,y,kind)=>trees.push({x:Math.round(x),y:Math.round(y),kind,v:(R()*3)|0,phase:R()*TAU});
  for(let x=14;x<=1150;x+=44){if(Math.abs(x-576)<74)continue;T(x+(R()-.5)*10,46+(R()-.5)*10,'pine');}
  for(let x=36;x<=1140;x+=50){if(Math.abs(x-576)<92)continue;T(x+(R()-.5)*12,104+(R()-.5)*8,R()<.55?'pine':'oak');}
  T(520,18,'pine');T(634,22,'pine');
  for(let y=160;y<=780;y+=54){T(24+(R()-.5)*8,y+(R()-.5)*10,R()<.4?'pine':'oak');T(1128+(R()-.5)*8,y+(R()-.5)*10,R()<.4?'pine':'oak');}
  [[372,300],[772,252],[432,642],[714,664],[380,566],[100,548],[1052,560],[1050,420],[470,772],[694,776],[328,776],[1060,760]].forEach(p=>T(p[0],p[1],'oak'));
  [[500,690],[660,700],[110,388],[1066,206]].forEach(p=>T(p[0],p[1],'palm'));
  for(let i=trees.length-1;i>=0;i--){const t=trees[i];if(t.x>990&&Math.abs(t.y-446)<58)trees.splice(i,1);}

  const bushes=[[142,322],[310,322],[840,328],[1008,328],[154,720],[302,720],[492,104],[660,104],[450,382],[702,382]].map(p=>({x:p[0],y:p[1],v:0}));
  const hedge=[];
  for(let x=10;x<=1150;x+=30){hedge.push({x:x+(R()-.5)*6,y:828+(R()-.5)*4,v:1});hedge.push({x:x+15+(R()-.5)*6,y:860,v:1});}
  const lamps=[[470,352],[682,352],[470,530],[682,530]].map(p=>({x:p[0],y:p[1],phase:R()*TAU}));
  const benches=[{x:512,y:344},{x:576,y:760},{x:690,y:320}];
  const barrels=[{x:1046,y:300},{x:1066,y:284}];
  const crates=[{x:796,y:300},{x:104,y:640}];
  const fountain={x:576,y:436}, barricade={x:576,y:106}, heroSpawn={x:576,y:640};
  const falaj={x:624,y:106,w:20,h:214};
  const fences=[
    [[40,792],[1112,792]],
    [[760,600],[842,600]],[[886,600],[1016,600]],
    [[760,600],[760,760]],[[1016,600],[1016,760]],[[760,760],[1016,760]],
  ];
  const colliders=[];
  const rectC=(x,y,w,h,tag)=>colliders.push({t:'r',x,y,w,h,tag});
  const circC=(x,y,r,tag)=>colliders.push({t:'c',x,y,r,tag});
  rectC(0,0,58,VH,'edge');rectC(VW-58,0,58,416,'edge');rectC(VW-58,476,58,VH-476,'edge');rectC(VW-62,416,62,60,'eastgate');rectC(0,0,VW,72,'edge');rectC(0,VH-10,VW,10,'edge');
  houses.forEach(h=>rectC(h.x+2,h.base-112,h.w-4,112,'house'));
  trees.forEach(t=>circC(t.x,t.y-3,t.kind==='oak'?10:t.kind==='palm'?8:9,'tree'));
  bushes.forEach(b=>circC(b.x,b.y-5,11,'bush'));
  lamps.forEach(l=>circC(l.x,l.y-2,6,'lamp'));
  benches.forEach(b=>rectC(b.x-21,b.y-12,42,13,'bench'));
  barrels.forEach(b=>circC(b.x,b.y-4,11,'barrel'));
  crates.forEach(c=>rectC(c.x-14,c.y-18,28,18,'crate'));
  colliders.push({t:'e',x:fountain.x,y:fountain.y,rx:66,ry:42,tag:'fountain'});
  rectC(480,84,192,24,'barricade');
  rectC(falaj.x,falaj.y,falaj.w,falaj.h,'falaj');
  fences.forEach(([a,b])=>{
    if(a[1]===b[1])rectC(Math.min(a[0],b[0])-3,a[1]-6,Math.abs(b[0]-a[0])+6,10,'fence');
    else rectC(a[0]-5,Math.min(a[1],b[1])-4,10,Math.abs(b[1]-a[1])+8,'fence');
  });
  const forestZone={x:470,y:72,w:212,h:112};
  return {plaza,lookout,paths,onRoad,onPlaza,onLookout,onAnyPath,houses,trees,bushes,hedge,lamps,benches,barrels,crates,fountain,barricade,falaj,fences,colliders,heroSpawn,forestZone};
})();

// ---- src/world/interiors.js ----
// تصميم داخل البيوت الثلاثة

/* =========================================================
   INTERIORS (data)
   ========================================================= */
const IW=448, IH=320, WALL=96, GAP0=200, GAP1=248;
const INTERIORS={
  A:{name:'بيت أم سعيد',wall:['#f0ddb7','#dcc39a'],floor:['#d9c39d','#cfb68e'],rug:{x:116,y:168,w:216,h:96,base:'#a3302a',band:'#221b1a',acc:'#f2e3c2',gold:'#e0a83e'},
     cushions:[{side:'back',a:30,b:200},{side:'left',a:122,b:232}],cush:['#7a2a2a','#d9a23f','#2f5d4a'],window:{x:300},niches:[60,232],lanterns:[150],
     props:[{t:'hearth',x:390,y:152},{t:'tray',x:224,y:220},{t:'chest',x:66,y:292},{t:'jar',x:404,y:214},{t:'jar',x:420,y:240,s:.8},{t:'plant',x:388,y:296}]},
  B:{name:'بيت راشد',wall:['#ecdcc0','#d6c19e'],floor:['#d3bd98','#c9b08a'],rug:{x:170,y:192,w:128,h:74,base:'#2f5d4a',band:'#221b1a',acc:'#f2e3c2',gold:'#d8443a'},

/* =========================================================
   Collision: circle feet vs rect / circle / ellipse
   ========================================================= */
function resolve(px,py,r,list,W,H){
  for(let iter=0;iter<4;iter++){
    let hit=false;
    for(const c of list){
      if(c.t==='r'){
        const qx=clamp(px,c.x,c.x+c.w),qy=clamp(py,c.y,c.y+c.h);
        const dx=px-qx,dy=py-qy,d2=dx*dx+dy*dy;
        if(d2<r*r){hit=true;
          if(d2>1e-8){const d=Math.sqrt(d2);px+=dx/d*(r-d);py+=dy/d*(r-d);}
          else{const l=px-c.x,rt=c.x+c.w-px,t=py-c.y,b=c.y+c.h-py,m=Math.min(l,rt,t,b);
            if(m===l)px=c.x-r;else if(m===rt)px=c.x+c.w+r;else if(m===t)py=c.y-r;else py=c.y+c.h+r;}
        }
      }else if(c.t==='c'){
        const dx=px-c.x,dy=py-c.y,d=Math.hypot(dx,dy),min=c.r+r;
        if(d<min){hit=true;if(d>1e-6){px=c.x+dx/d*min;py=c.y+dy/d*min;}else py=c.y+min;}
      }else if(c.t==='k'){
        const q=corridorClamp(px,py);if(q){px=q.x;py=q.y;}
      }else{
        const k=c.rx/c.ry,dx=px-c.x,dy=(py-c.y)*k,d=Math.hypot(dx,dy),min=c.rx+r;
        if(d<min){hit=true;if(d>1e-6){px=c.x+dx/d*min;py=c.y+dy/d*min/k;}else py=c.y+min/k;}
      }
    }
    if(!hit)break;
  }
  return {x:clamp(px,r,W-r),y:clamp(py,r,H-r)};
}

  add(470,1112,[1080,400,1150,480],g=>{if(P.flags.ch3)return;g.fillStyle='#6f4a2b';[424,446,468].forEach(y=>{g.fillRect(1108,y-26,6,26);});g.strokeStyle='#b53e2c';g.lineWidth=2.4;g.beginPath();g.moveTo(1111,404);g.lineTo(1111,446);g.lineTo(1111,468);g.stroke();g.strokeStyle='#d9b27a';g.lineWidth=1.6;g.beginPath();[410,420].forEach(o=>{g.moveTo(1111,o);g.lineTo(1111,o+52);});g.stroke();g.fillStyle='#c99a5e';rr(g,1098,396,26,16,2);g.fill();g.strokeStyle='#b23a2a';g.lineWidth=2.2;g.beginPath();g.moveTo(1104,399);g.lineTo(1118,409);g.moveTo(1118,399);g.lineTo(1104,409);g.stroke();});
  const B=MAP.barricade;add(B.y,B.x,[B.x-72,B.y-60,B.x+72,B.y+4],g=>{if(!chapterDone)blit(g,SPR.barricade,B.x,B.y);});

const PROP_SPRITE={hearth:'hearth',tray:'tray',chest:'chest',jar:'jar',plant:'plant',bench:'bench2',loom:'loom',mabkhara:'mabkhara',cat:'cat'};
function interiorStatics(cfg){
  return cfg.props.map(p=>{
    const key=PROP_SPRITE[p.t],sc=p.s||1;
    return {y:p.t==='tray'||p.t==='cat'?p.y-6:p.y,x:p.x,b:[p.x-50,p.y-80,p.x+50,p.y+6],draw:(g,t)=>{
      if(sc!==1){g.save();g.translate(p.x,p.y);g.scale(sc,sc);blit(g,SPR[key],0,0);g.restore();}else blit(g,SPR[key],p.x,p.y);
      if(p.t==='hearth'){
        for(let i=0;i<3;i++){const fl=Math.sin(t*12+i*2)*1.4,h=7+Math.sin(t*9+i)*2;g.fillStyle=i===1?'#ffd36b':'#f07a2e';g.beginPath();g.moveTo(p.x-10+i*7,p.y-5);g.quadraticCurveTo(p.x-7+i*7+fl,p.y-5-h*1.6,p.x-4+i*7,p.y-5);g.closePath();g.fill();}
        const gr=g.createRadialGradient(p.x,p.y-8,0,p.x,p.y-8,40);gr.addColorStop(0,`rgba(255,150,60,${.25+.05*Math.sin(t*10)})`);gr.addColorStop(1,'rgba(255,150,60,0)');g.fillStyle=gr;g.fillRect(p.x-40,p.y-48,80,80);
        for(let i=0;i<3;i++){const k=(t*.35+i/3)%1;g.fillStyle=`rgba(245,240,232,${.35*(1-k)})`;circ(g,p.x+Math.sin(t+i*2)*3,p.y-40-k*30,2.5+k*5);}
      }else if(p.t==='mabkhara'){
        for(let i=0;i<4;i++){const k=(t*.3+i/4)%1;g.fillStyle=`rgba(240,236,228,${.4*(1-k)*Math.min(1,k*6)})`;circ(g,p.x+Math.sin(t*1.6+i*1.7+k*4)*(2+k*5),p.y-18-k*42,2+k*5);}
        const gr=g.createRadialGradient(p.x,p.y-15,0,p.x,p.y-15,14);gr.addColorStop(0,`rgba(255,140,60,${.3+.1*Math.sin(t*8)})`);gr.addColorStop(1,'rgba(255,140,60,0)');g.fillStyle=gr;g.fillRect(p.x-14,p.y-29,28,28);
      }
    }};
  });
}
function drawFountain(g,x,y,t){
  blit(g,SPR.basin,x,y);
  if(dryVillage()){g.fillStyle='#5a5348';ell(g,x,y,50,29.4);g.fill();g.fillStyle='rgba(60,110,130,.7)';ell(g,x+8,y+6,22,10);g.fill();blit(g,SPR.pillar,x,y);return;}
  g.save();ell(g,x,y,50,29.4);g.clip();
  const wg=g.createLinearGradient(x,y-30,x,y+30);wg.addColorStop(0,'#4f9fb8');wg.addColorStop(1,'#2f7896');
  g.fillStyle=wg;g.fillRect(x-52,y-31,104,62);
  g.lineWidth=1.3;
  for(let i=0;i<3;i++){const k=(t*.42+i/3)%1,r=10+k*42;g.strokeStyle=`rgba(225,246,255,${.55*(1-k)})`;ell(g,x,y+2,r,r*.58);g.stroke();}
  g.fillStyle='rgba(255,255,255,.75)';
  for(let i=0;i<6;i++){const a=t*.3+i*1.05,r2=22+12*Math.sin(t*.7+i);g.globalAlpha=.5+.5*Math.sin(t*3+i*2);g.fillRect(x+Math.cos(a)*r2,y+Math.sin(a)*r2*.55,2.4,1);}
  g.globalAlpha=1;g.restore();
  blit(g,SPR.pillar,x,y);
  g.lineCap='round';g.lineWidth=1.8;g.setLineDash([5,4]);g.lineDashOffset=-t*26;
  for(let i=0;i<8;i++){const a=i/8*TAU+.2,sx=x+Math.cos(a)*18,sy=y-42+Math.sin(a)*6,ex=x+Math.cos(a)*36,ey=y+Math.sin(a)*21;
    g.strokeStyle=Math.sin(a)<0?'rgba(210,240,255,.45)':'rgba(230,248,255,.75)';
    g.beginPath();g.moveTo(sx,sy);g.quadraticCurveTo(x+Math.cos(a)*33,sy-6,ex,ey);g.stroke();}
  g.strokeStyle='rgba(235,250,255,.85)';g.lineWidth=1.6;g.beginPath();g.moveTo(x,y-60);g.quadraticCurveTo(x-6,y-72,x-12,y-46);g.moveTo(x,y-60);g.quadraticCurveTo(x+6,y-72,x+12,y-46);g.stroke();
  g.setLineDash([]);
  g.fillStyle='rgba(240,252,255,.8)';
  for(let i=0;i<5;i++){const k=(t*.9+i/5)%1;circ(g,x+Math.cos(i*1.3)*(10+k*14),y-62+k*20+k*k*10,1);}
}

/* ---------- screen shake & haptics ---------- */
const SHAKE={t0:-9,amp:0,dur:0};
const feelOn=()=>OPT.shake!=='off';
function shake(amp,dur=.25){if(!feelOn())return;if(time-SHAKE.t0<SHAKE.dur&&amp<SHAKE.amp*(1-(time-SHAKE.t0)/SHAKE.dur))return;SHAKE.t0=time;SHAKE.amp=amp;SHAKE.dur=dur;}
function shakeOffset(){
  const k=(time-SHAKE.t0)/SHAKE.dur;if(k<0||k>=1)return [0,0];
  const a=SHAKE.amp*(1-k)*(1-k);
  return [Math.sin(time*93.1)*a*.8+Math.sin(time*57.3)*a*.4,Math.cos(time*81.7)*a*.7];
}
function buzz(p){if(!feelOn()||!navigator.vibrate)return;try{navigator.vibrate(p);}catch(_){}}

/* ---------- hit stop: the picture holds for a beat when a blow lands ---------- */
let freezeT=-9,freezeUntil=-9;
const animTime=()=>time<freezeUntil?freezeT:time;
function hitStop(ms){freezeT=time;freezeUntil=time+ms/1000;return wait(ms);}

/* ---------- battle transition: the field shatters, the arena opens like an eye ---------- */
let TR=null;
function startTransition(boss,onMid){
  const img=document.createElement('canvas');img.width=canvas.width;img.height=canvas.height;
  try{img.getContext('2d').drawImage(canvas,0,0);}catch(_){}
  const lead=boss?.55:0;
  TR={t0:time,img,boss,lead,mid:lead+.5,end:lead+1.05,onMid,fired:false};gameEl.classList.add('transit');
  if(boss){shake(6,.5);buzz(80);}
}
function drawTransition(){
  if(!TR)return;
  const g=ctx,w=canvas.width,h=canvas.height,k=time-TR.t0;
  if(!TR.fired&&k>=TR.mid){TR.fired=true;gameEl.classList.remove('transit');try{TR.onMid();}catch(err){console.error(err);}}
  if(k>=TR.end){TR=null;return;}
  g.save();g.setTransform(1,0,0,1,0,0);
  if(k<TR.mid){
    if(k<TR.lead){ // boss: the world pulses and reddens before it breaks
      const q=k/TR.lead,z=1+.05*Math.sin(q*Math.PI*3)*q;
      g.fillStyle='#000';g.fillRect(0,0,w,h);
      g.translate(w/2,h/2);g.scale(z,z);g.drawImage(TR.img,-w/2,-h/2);g.setTransform(1,0,0,1,0,0);
      g.fillStyle=`rgba(150,20,10,${.35*q})`;g.fillRect(0,0,w,h);
    }else{
      const q=(k-TR.lead)/(TR.mid-TR.lead);
      g.fillStyle='#0b0704';g.fillRect(0,0,w,h);
      const cols=OPT.quality==='saver'?6:9,rows=Math.max(4,Math.round(cols*h/w)),tw=w/cols,th=h/rows,cx=w/2,cy=h/2,maxd=Math.hypot(cx,cy);
      for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
        const x=c*tw,y=r*th,mx=x+tw/2,my=y+th/2,dx=mx-cx,dy=my-cy,dist=Math.hypot(dx,dy)/maxd;
        const p=clamp((q-(1-dist)*.35)/.65,0,1),e=p*p;
        if(p>=1)continue;
        g.save();g.globalAlpha=1-e;
        g.translate(mx+dx*e*1.4,my+dy*e*1.4+e*h*.15);g.rotate((dx>0?1:-1)*e*2.2*(.5+((r*7+c*13)%5)/5));g.scale(1-e*.5,1-e*.5);
        g.drawImage(TR.img,x,y,tw+1,th+1,-tw/2,-th/2,tw+1,th+1);
        g.restore();
      }
      if(q<.2){g.fillStyle=`rgba(255,248,230,${(.2-q)*4})`;g.fillRect(0,0,w,h);}
    }
  }else{ // reveal: a circle opens from the middle of the arena
    const q=(k-TR.mid)/(TR.end-TR.mid),e=1-Math.pow(1-q,3),R=e*Math.hypot(w,h)*.6;
    g.fillStyle='#0b0704';g.beginPath();g.rect(0,0,w,h);g.moveTo(w/2+R,h*.42);g.arc(w/2,h*.42,Math.max(1,R),0,TAU,true);g.fill('evenodd');
  }
  g.restore();
}

/* ---------- overworld particles: dust, footprints, ripples ---------- */
const PUFFS=[],PRINTS=[],RIPPLES=[];
let lastRipple=0;
function stepFeel(kind,side){
  const sc=scene.id,col=sc==='wadi'?'216,191,142':sc==='fort'?'201,168,118':sc==='forest'?'143,122,84':kind==='stone'?'203,189,159':null;
  if(col&&OPT.quality!=='saver'&&hero.moving){
    for(let i=0;i<2;i++)PUFFS.push({x:hero.x+(Math.random()-.5)*8,y:hero.y-1,vx:(Math.random()-.5)*14,vy:-6-Math.random()*8,r:2+Math.random()*2,t0:time,life:.55,col});
    if(PUFFS.length>60)PUFFS.splice(0,PUFFS.length-60);
  }
  if(sc==='wadi'||sc==='forest'&&FOREST.nearest(hero.x,hero.y).d<40){
    const a={up:-Math.PI/2,down:Math.PI/2,left:Math.PI,right:0}[hero.dir]||0,off=side>0?3:-3;
    PRINTS.push({x:hero.x+Math.cos(a+Math.PI/2)*off,y:hero.y-1+Math.sin(a+Math.PI/2)*off,a,t0:time,sc});
    if(PRINTS.length>70)PRINTS.shift();
  }
}
function waterNearHero(){
  if(scene.id==='village'&&!dryVillage()){
    const F=MAP.fountain,dx=hero.x-F.x,dy=(hero.y-F.y)*1.6,d=Math.hypot(dx,dy);
    if(d<110){const a=Math.atan2(dy,dx);return {x:F.x+Math.cos(a)*40,y:F.y+Math.sin(a)*23,rx:1};}
    const L=MAP.falaj;if(hero.x>L.x-30&&hero.x<L.x+L.w+30&&hero.y>L.y&&hero.y<L.y+L.h)return {x:L.x+L.w/2,y:hero.y-4,rx:.45};
  }
  if(scene.wadi&&P.flags.gates){
    if(hero.y<215)return {x:clamp(hero.x,10,WADI.spring.x-40),y:150,rx:.5};
    const s=WADI.spring;if(Math.hypot(hero.x-s.x,(hero.y-s.y)*1.4)<110){const a=Math.atan2(hero.y-s.y,hero.x-s.x);return {x:s.x+Math.cos(a)*34,y:s.y+Math.sin(a)*18,rx:1};}
  }
  return null;
}
function feelTick(){
  if(state!=='play'||!hero.moving)return;
  if(time-lastRipple>.32){const w=waterNearHero();if(w){lastRipple=time;RIPPLES.push({x:w.x,y:w.y,rx:w.rx,t0:time,sc:scene.id});if(RIPPLES.length>24)RIPPLES.shift();}}
}
function drawGroundFeel(g){ // under everything that stands
  for(let i=PRINTS.length-1;i>=0;i--){const p=PRINTS[i],k=(time-p.t0)/8;if(k>=1||p.sc!==scene.id){if(k>=1)PRINTS.splice(i,1);continue;}
    g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=`rgba(90,60,30,${.36*(1-k)})`;ell(g,0,0,3.2,1.8);g.fill();g.restore();}
}
function drawAirFeel(g){ // over the scene
  for(let i=RIPPLES.length-1;i>=0;i--){const r=RIPPLES[i],k=(time-r.t0)/1.1;if(k>=1||r.sc!==scene.id){RIPPLES.splice(i,1);continue;}
    g.strokeStyle=`rgba(230,248,255,${.6*(1-k)})`;g.lineWidth=1.1;ell(g,r.x,r.y,(3+k*16)*(r.rx<1?r.rx+.4:1),(3+k*16)*.5);g.stroke();}
  for(let i=PUFFS.length-1;i>=0;i--){const p=PUFFS[i],k=(time-p.t0)/p.life;if(k>=1){PUFFS.splice(i,1);continue;}
    g.fillStyle=`rgba(${p.col},${.45*(1-k)})`;circ(g,p.x+p.vx*k,p.y+p.vy*k,p.r*(1+k*1.4));}
}

function resize(){
  readInsets();
  const w=Math.max(1,gameEl.clientWidth),h=Math.max(1,gameEl.clientHeight);
  view.w=w;view.h=h;view.dpr=Math.min(window.devicePixelRatio||1,OPT.quality==='saver'?1.25:2);

  canvas.width=Math.round(w*view.dpr);canvas.height=Math.round(h*view.dpr);
  const S=Math.min(view.zoom*view.dpr,2.5,Math.sqrt(12e6/(VW*VH)));
  const build=()=>{view.S=S;SPR=buildSprites(S);ensureScene(scene);};
  if(!SPR)build();
  else if(Math.abs(S-view.S)>.05){clearTimeout(rebuildTimer);rebuildTimer=setTimeout(build,140);}
  const vg=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.35,w/2,h/2,Math.hypot(w,h)*.62);
  vg.addColorStop(0,'rgba(40,20,6,0)');vg.addColorStop(1,'rgba(40,20,6,.34)');view.vig=vg;

  base.style.transform=`translate(${x}px,${y}px)`;
  knob.style.transform='translate(0px,0px)';
}
function stickMove(e){
  const zr=zone.getBoundingClientRect();
  let dx=e.clientX-zr.left-stick.cx,dy=e.clientY-zr.top-stick.cy;
  const d=Math.hypot(dx,dy);if(d>stick.R){dx*=stick.R/d;dy*=stick.R/d;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  stick.dx=dx/stick.R;stick.dy=dy/stick.R;
}
function releaseStick(){stick.active=false;stick.id=null;stick.dx=stick.dy=0;stickHome(false);}
zone.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state!=='play'||stick.active)return;
  const zr=zone.getBoundingClientRect(),half=base.offsetWidth/2||62;
  stick.active=true;stick.id=e.pointerId;
  try{zone.setPointerCapture(e.pointerId);}catch(_){}
  stick.cx=clamp(e.clientX-zr.left,half+6,zr.width-half-6);
  stick.cy=clamp(e.clientY-zr.top,half+6,zr.height-half-6);
  base.classList.remove('returning');
  base.style.transform=`translate(${stick.cx}px,${stick.cy}px)`;
  stickMove(e);
});
zone.addEventListener('pointermove',e=>{if(stick.active&&e.pointerId===stick.id){e.preventDefault();stickMove(e);}});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>zone.addEventListener(n,e=>{if(e.pointerId===stick.id)releaseStick();}));
function resetInput(){if(stick.active||stick.dx||stick.dy)releaseStick();keys.up=keys.down=keys.left=keys.right=false;hero.moving=false;}

actBtn.addEventListener('pointerdown',e=>{e.preventDefault();actBtn.classList.add('down');act();});
['pointerup','pointercancel','pointerleave'].forEach(n=>actBtn.addEventListener(n,()=>actBtn.classList.remove('down')));
let nextArmed=false;

startBtn.addEventListener('click',()=>{if(state!=='title')return;if(savedData){if(startBtn.dataset.confirm!=='1'){startBtn.dataset.confirm='1';startBtn.textContent='اضغط مرة أخرى لمسح التقدم';return;}startBtn.dataset.confirm='';resetWorld();}startGame();});

const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
window.addEventListener('keydown',e=>{

// الحوار والفصول والانتقال بين المشاهد

/* =========================================================

let toastKey=null,toastUntil=0;
function showToast(key,html,dur){toastEl.innerHTML=html;toastEl.classList.add('show');toastKey=key;toastUntil=dur?time+dur:Infinity;}
function hideToast(){toastEl.classList.remove('show');toastKey=null;toastGap=time+.3;}
const toastQ=[];let toastGap=0;
function notify(html,dur=2.4){if(toastKey&&toastKey!=='hint')toastQ.push([html,dur]);else showToast('note',html,dur);}
function updateHud(bump){
  hud.hidden=!questStarted;
  const all=met.size>=VILLAGERS.length;
  hud.classList.toggle('done',all);
  hudLabel.textContent=chapterDone?'انتهى الفصل الأول':all?'عُد إلى سالم':'أهل القرية';
  hudCount.textContent=chapterDone||all?'':`${AR(met.size)} من ${AR(VILLAGERS.length)}`;
  hudCount.hidden=chapterDone||all;
  if(bump){hud.classList.remove('bump');void hud.offsetWidth;hud.classList.add('bump');}
}
function startGame(resume){
  if(state!=='title')return;
  state='play';gameEl.classList.remove('title');titleEl.classList.add('leaving');
  setTimeout(()=>{if(state!=='title')titleEl.hidden=true;},520);
  updateHud(false);SFX.play('start');
  if(resume){showToast('note','أهلًا بعودتك إلى عين الوادي',2.4);return;}
  saveGame();
  const desktop=matchMedia('(hover:hover) and (pointer:fine)').matches;
  showToast('hint','تحرّك بالعصا، واقترب من سالم للتحدث معه'+(desktop?'<small>على الحاسوب: الأسهم أو WASD، وزر E للتفاعل</small>':''),6.5);
}
function act(){
  if(state==='dialog'){advance();return;}
  if(state!=='play'||talkCooldown>0||!target)return;
  if(target.kind==='npc')openDialog(target.npc);
  else if(target.kind==='door')enterHouse(target.house);
  else if(target.kind==='exit')exitHouse();
  else if(target.kind==='gate'){openGate(target.i);talkCooldown=.5;}
  else if(target.kind==='pot'){smashPot(target.p);talkCooldown=.4;}
  else if(target.kind==='innergate'){tryInnerGate();talkCooldown=.6;}
  else if(target.kind==='pickup'){takePickup(target.p);talkCooldown=.2;}
  else if(target.kind==='spring'){const full=curHP()>=stat('hp')&&curMP()>=stat('mp')&&(!P.flags.aisha||allyHP()>=allyStat('hp')&&allyMP()>=allyStat('mp'));P.hp=null;P.mp=null;P.ally={hp:null,mp:null};SFX.play('water');showToast('note',scene.fort?'شربتم من بئر الحصن<small>عادت إليكم الصحة والطاقة</small>':dryVillage()?'بقي في الحوض قليل من الماء…<small>شربتم فعادت إليكم الصحة والطاقة</small>':full?'ماء النافورة بارد وعذب':'شربت من ماء النافورة<small>عادت إليك صحتك وطاقتك كاملتين</small>',2.6);saveGame();talkCooldown=.5;}
}
function face(from,to){const dx=to.x-from.x,dy=to.y-from.y;return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');}
function remainingLine(left){
  const who=left===1?'شخص واحد لم تتعرّف عليه':left===2?'شخصان لم تتعرّف عليهما':`${AR(left)} أشخاص لم تتعرّف عليهم`;
  return `بقي ${who} بعد. بعضهم داخل البيوت، فلا تتردد في طرق الأبواب.`;
}
function linesFor(n){
  if(n===SIGN)return SIGN_LINES;
  if(n===ALTAR)return P.flags.boss3?['المنصة فارغة الآن. أخذتم الشظية الثالثة.']:['على المنصة تتوهج الشظية الثالثة.','تمتد أيديكما إليها… فتهتز الأرض وتتحرك الجدران!'];
  if(n===SPRING){
    if(P.flags.boss2)return ['ماء العين صافٍ وبارد. شربتم منه فعادت إليكم قوتكم.'];
    if(P.flags.gates)return ['الماء يتدفّق من العين… لكن الماء يغلي ويضطرب.','ترتفع من العين حيّة عظيمة، عيناها تلمعان كالذهب!'];
    return ['العين مسدودة، والماء فيها راكد وقليل.','ربما للبوابات الثلاث على الفلج علاقة بذلك.'];
  }
  if(n===STONE){
    if(P.flags.ending)return ['النجمة تلمع في السماء فوق الغابة، وتضيء لأهل الوادي كل ليلة.'];
    if(P.flags.boss3)return ENDING_LINES;
    if(P.flags.boss)return ['الحجر هادئ الآن، وفي مكان النقش فراغ على شكل نجمة.'];
    return (n.talked?['يعود الحجر إلى التوهّج… والحارس ينتظر.']:STONE.lines).concat('فجأة يشتد الوهج، وينهض من الحجر حارس من نور!');
  }
  if(n.id==='aisha'&&chapterDone&&!P.flags.aisha)return AISHA_JOIN;
  if(n===SALEM){
    if(!questStarted)return SALEM_INTRO;
    if(P.flags.ending)return ['انظرا إلى السماء! نجمة الوادي عادت تلمع فوقنا.','عين الوادي بيتكما دائمًا. أهلًا بكما متى شئتما.'];
    if(P.flags.boss3)return ['الشظايا الثلاث! خذاها إلى حجر النور في قلب الغابة، فهناك سقطت النجمة.'];
    if(P.flags.ch4)return ['الحصن خلف الوادي. انزلا الدرج في جنوب الوادي، وابحثا عن مفتاح بوابته الداخلية.'];
    if(P.flags.boss2)return SALEM_CH4;
    if(P.flags.boss)return P.flags.ch3?['الوادي شرق القرية. اتبعا الطريق من الساحة، وانتبها للعقارب والأفاعي.','اقرأا النقش عند مدخل الوادي قبل أن تفتحا البوابات.']:SALEM_CH3;
    if(chapterDone)return P.flags.aisha?['عائشة معك، فلا تخف. امضِ نحو الضوء، وإن تعبتما فاشربا من ماء النافورة.']:['طريق الغابة مفتوح الآن. عائشة تنتظرك عند مدخله، ولن تتركك تذهب وحدك.'];
    if(met.size>=VILLAGERS.length)return SALEM_END;
    return ['أهل القرية طيبون، سلّم عليهم واحدًا واحدًا.',remainingLine(VILLAGERS.length-met.size)];
  }
  const ql=questLines(n);if(ql)return ql;
  return n.talked?n.repeat:n.lines;
}
function openDialog(n){
  state='dialog';resetInput();talkNpc=n;lines=linesFor(n);
  hero.dir=face(hero,n);n.dir=face(n,hero);n.moving=false;
  page=0;dlgName.textContent=n.name;
  dotsEl.innerHTML=lines.map(()=>'<i></i>').join('');dotsEl.style.visibility=lines.length<2?'hidden':'visible';
  drawPortrait(n);SFX.play(n.portrait?'mystic':'dlgOpen');renderPage(true);
  dlg.hidden=false;gameEl.classList.add('talking');actBtn.classList.remove('ready');

}
function renderPage(first){
  dlgText.textContent=lines[page];
  if(!first||talkNpc&&!talkNpc.portrait)setTimeout(()=>SFX.voice(talkNpc,lines[page]||''),first?120:40);

}
function advance(){
  if(state!=='dialog')return;
  page++;

  SFX.play('dlgNext');renderPage();
}
function closeDialog(){
  SFX.play('dlgClose');dlg.hidden=true;gameEl.classList.remove('talking');
  state='play';page=0;talkCooldown=.3;resetInput();
  const n=talkNpc,said=lines;talkNpc=null;
  if(!n)return;
  n.talked++;n.lookAt=time+2.5;
  if(n===SALEM){
    if(!questStarted){questStarted=true;updateHud(true);const gl=giveGift(n);showToast('note',(met.size>=VILLAGERS.length?'تعرّفت على الجميع. تحدّث إلى سالم مرة أخرى':'مهمة جديدة: تعرّف على أهل القرية')+gl,3.2);gainXP(XP_SALEM);}
    else if(said===SALEM_CH4&&!P.flags.ch4){P.flags.ch4=1;SFX.play('quest');notify('فُتح الدرج إلى الحصن القديم<small>في جنوب وادي الفلج</small>',3.6);}
    else if(said===SALEM_CH3&&!P.flags.ch3){P.flags.ch3=1;SFX.play('quest');notify('فُتح طريق الوادي شرق القرية<small>اتبع الطريق شرقًا من الساحة</small>',3.6);}
    else if(said===SALEM_END){chapterDone=true;P.money+=150;updateHud(false);gainXP(XP_CHAPTER);openChapter();}
  }else if(n.noMeet){
    if(n===STONE){P.flags.stone=1;if(!P.flags.boss)setTimeout(()=>startEncounter({types:['guardian'],boss:true}),250);}
    if(n===ALTAR&&!P.flags.boss3)setTimeout(()=>startEncounter({types:['golem'],boss:true}),250);
    if(n===STONE&&said===ENDING_LINES&&!P.flags.ending){P.flags.ending=1;fadeEl.classList.add('white','on');setTimeout(()=>{fadeEl.classList.remove('on');setTimeout(()=>fadeEl.classList.remove('white'),400);openEnding();},900);}
    if(n===SPRING){if(P.flags.boss2){P.hp=null;P.mp=null;P.ally={hp:null,mp:null};SFX.play('water');}else if(P.flags.gates)setTimeout(()=>startEncounter({types:['serpent'],boss:true}),250);}
  }else if(n.id==='aisha'&&said===AISHA_JOIN){
    P.flags.aisha=1;P.ally={hp:null,mp:null};syncAisha();resetTrail();SFX.play('itemGet');
    notify('انضمت عائشة إلى فريقك<small>تقاتل معك وتشفي بسحرها، وتجد سحرها في القائمة</small>',3.6);$('menuDot').hidden=false;
  }else if(!met.has(n.id)){
    met.add(n.id);updateHud(true);SFX.play('quest');
    notify(`تعرّفت على ${n.name}${giveGift(n)}`,2.8);gainXP(XP_MEET);
    if(met.size>=VILLAGERS.length)notify('تعرّفت على الجميع. تحدّث إلى سالم عند النافورة',3.6);
  }
  if(questAct&&questAct.n===n&&said===questAct.lines){const qa=questAct;questAct=null;applyQuest(qa);}
  else if(n.shop&&said===n.repeat)openShop(n.shop);
  saveGame();
}
function giveGift(n){
  const gf=GIFTS[n.id];if(!gf||P.gifts[n.id])return '';
  P.gifts[n.id]=1;P.inv[gf.item]=(P.inv[gf.item]||0)+gf.n;SFX.play('itemGet',{d:.35});
  const it=ITEMS[gf.item];
  $('menuDot').hidden=false;
  return `<small>حصلت على: ${it.name}${gf.n>1?' ×'+AR(gf.n):''} · تجده في ${it.slot?'العتاد':'الحقيبة'}</small>`;
}
function gainXP(n){
  const before=levelOf(P.xp);P.xp+=n;const after=levelOf(P.xp);
  if(after>before){
    P.hp=null;P.mp=null;P.ally={hp:null,mp:null};SFX.play('levelUp',{d:.9});
    const learned=SKILLS.filter(s=>s.lv&&s.lv>before&&s.lv<=after).map(s=>s.name);
    notify(`ارتفع مستواك إلى ${AR(after)}${learned.length?'<small>تعلّمت: '+learned.join('، ')+'</small>':''}`,3);
    $('menuDot').hidden=false;
  }
}
let chapterCard=1;
function openChapter2(){

function closeChapter(){if(state!=='chapter')return;if(chapterCard===1){syncAisha();notify('فُتح طريق الغابة شمال القرية<small>وعائشة تنتظرك عند مدخله</small>',4);notify('أعطاك سالم ١٥٠ بيسة للطريق<small>سعيد يبيع المؤن، وراشد يصوغ من غنائم الغابة، وبعض أهل القرية يحتاجون مساعدتك</small>',4.4);}else if(chapterCard===4)notify('شكرًا لأنك لعبت أسرار عين الوادي<small>تستطيع إكمال المهام الجانبية وموسوعة المخلوقات</small>',4);else if(chapterCard===2)notify('تحدّث إلى سالم عند النافورة<small>ماء الفلج بدأ يجف!</small>',3.6);else notify('عاد الماء إلى عين الوادي<small>الفصل الرابع قادم: الحصن القديم</small>',3.6);chapterEl.classList.add('leaving');gameEl.classList.remove('talking');setTimeout(()=>{chapterEl.hidden=true;},500);state='play';talkCooldown=.4;}

// ---- src/core/update.js ----
// تحديث كل إطار

/* =========================================================
   UPDATE
   ========================================================= */
function inputVector(){
  let x=0,y=0;
  if(stick.active){x=stick.dx;y=stick.dy;}
  const kx=(keys.right?1:0)-(keys.left?1:0),ky=(keys.down?1:0)-(keys.up?1:0);
  if(kx||ky){x=kx;y=ky;}
  const m=Math.hypot(x,y);
  if(m<(stick.active&&!(kx||ky)?.22:.5))return null;
  return {x:x/m,y:y/m};
}
function chooseDir(v,cur){
  const ax=Math.abs(v.x),ay=Math.abs(v.y);
  if(ax>ay*1.2)return v.x>0?'right':'left';
  if(ay>ax*1.2)return v.y>0?'down':'up';
  const h=v.x>0?'right':'left',vv=v.y>0?'down':'up';
  return cur===h||cur===vv?cur:(ax>=ay?h:vv);
}
function collidersFor(who){
  const list=scene.colliders.filter(c=>!(c.tag==='barricade'&&chapterDone)&&!(c.tag==='eastgate'&&P.flags.ch3)&&!(c.tag==='rockfall'&&P.flags.ch4)&&!(c.tag==='innergate'&&P.flags.gateopen));
  for(const n of NPCS)if(n!==who&&n.scene===scene.id)list.push({t:'c',x:n.x,y:n.y-1,r:NPC_R});
  if(who!==hero)list.push({t:'c',x:hero.x,y:hero.y,r:HERO_R});
  return list;
}
function updateNpc(n,dt){
  if(state!=='play'){n.moving=false;return;}
  if(n.route&&n.route.length){walkRoute(n,dt);return;}
  const dh=Math.hypot(hero.x-n.x,hero.y-n.y);
  if(n.wander){
    if(dh<64){n.moving=false;n.dir=face(n,hero);return;}
    if(n.pause>0){n.pause-=dt;n.moving=false;return;}
    if(!n.target){
      const w=n.wander;
      for(let i=0;i<12;i++){const tx=w.x0+Math.random()*(w.x1-w.x0),ty=w.y0+Math.random()*(w.y1-w.y0),q=resolve(tx,ty,NPC_R+2,scene.colliders,scene.W,scene.H);if(Math.hypot(q.x-tx,q.y-ty)<.5){n.target={x:tx,y:ty};break;}}
      if(!n.target){n.pause=1;return;}
    }
    const dx=n.target.x-n.x,dy=n.target.y-n.y,d=Math.hypot(dx,dy);
    if(d<3){n.target=null;n.pause=1+Math.random()*2.5;n.moving=false;return;}
    const step=Math.min(d,n.wander.speed*dt),p=resolve(n.x+dx/d*step,n.y+dy/d*step,NPC_R,collidersFor(n),scene.W,scene.H);
    const moved=Math.hypot(p.x-n.x,p.y-n.y);n.x=p.x;n.y=p.y;
    n.dir=chooseDir({x:dx/d,y:dy/d},n.dir);n.moving=true;n.phase+=dt*10;
    if(moved<step*.35){n.stuck+=dt;if(n.stuck>.5){n.target=null;n.pause=.4;n.stuck=0;}}else n.stuck=0;
    return;
  }
  n.moving=false;
  if(dh<90)n.dir=face(n,hero);

function findTarget(){

    }else{hero.moving=false;hero.phase=0;}

/* =========================================================
   FOREST PATH (opens after chapter one)
   ========================================================= */
const FW=640,FH=1200;
const FOREST=(()=>{
  const R=mulberry(777);
  const path=[[320,FH+40],[320,940],[232,770],[252,620],[392,470],[362,330],[320,250]];
  const clearing={x:320,y:165,r:118};
  const maxD=38;
  const stone={x:320,y:124};
  function nearest(x,y){let best=1e9,bx=0,by=0;for(let i=0;i<path.length-1;i++){const a=path[i],b=path[i+1],dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=((x-a[0])*dx+(y-a[1])*dy)/l;t=clamp(t,0,1);const qx=a[0]+t*dx,qy=a[1]+t*dy,d=Math.hypot(x-qx,y-qy);if(d<best){best=d;bx=qx;by=qy;}}return {d:best,x:bx,y:by};}
  const near=(x,y,m)=>nearest(x,y).d<m||Math.hypot(x-clearing.x,y-clearing.y)<clearing.r+m-34;
  const trees=[];
  for(let y=-20,row=0;y<FH+40;y+=44,row++)for(let x=-20;x<FW+40;x+=46){
    const tx=x+(R()-.5)*22+(row&1)*23,ty=y+(R()-.5)*16;
    if(near(tx,ty,60))continue;
    trees.push({x:Math.round(tx),y:Math.round(ty),kind:R()<.66?'pine':'oak',v:(R()*3)|0,phase:R()*TAU});
  }
  const corridor={t:'k',tag:'corridor'};
  const colliders=[corridor,{t:'c',x:stone.x,y:stone.y-2,r:20,tag:'stone'}];
  return {path,clearing,maxD,stone,nearest,near,trees,colliders};
})();
function corridorClamp(x,y){
  const F=FOREST,n=F.nearest(x,y),C=F.clearing,dc=Math.hypot(x-C.x,y-C.y),cr=C.r-8;
  if(n.d<=F.maxD||dc<=cr)return null;
  const ax=n.x+(x-n.x)/n.d*F.maxD,ay=n.y+(y-n.y)/n.d*F.maxD;
  const bx=C.x+(x-C.x)/dc*cr,by=C.y+(y-C.y)/dc*cr;
  return Math.hypot(ax-x,ay-y)<Math.hypot(bx-x,by-y)?{x:ax,y:ay}:{x:bx,y:by};
}
function buildForestGround(S){
  const cv=document.createElement('canvas');cv.width=Math.ceil(FW*S);cv.height=Math.ceil(FH*S);
  const g=cv.getContext('2d');g.scale(S,S);

/* =========================================================
   DAY & NIGHT
   ========================================================= */
const DAY_RATE=4; // game minutes per real second (a full day lasts 6 minutes)
const hourNow=()=>((P.clock??540)%1440)/60;
function nightAmount(h=hourNow()){
  if(h>=6&&h<17)return 0;
  if(h>=17&&h<19.5)return (h-17)/2.5;
  if(h>=4.5&&h<6)return 1-(h-4.5)/1.5;
  return 1;
}
function duskAmount(h=hourNow()){return h>=16.5&&h<19.5?Math.sin((h-16.5)/3*Math.PI):h>=5&&h<6.5?Math.sin((h-5)/1.5*Math.PI)*.6:0;}
function phaseName(h=hourNow()){return h<5?'الليل':h<6.5?'الفجر':h<11.5?'الصباح':h<14.5?'الظهيرة':h<17?'العصر':h<19.5?'المغرب':'الليل';}
const isNight=()=>nightAmount()>.6;
let nightCv=null;
function sceneLights(){
  const L=[],push=(x,y,r,a=1)=>L.push([x,y,r,a]);
  if(scene.id==='village'){
    MAP.lamps.forEach(l=>push(l.x,l.y-52,82));
    MAP.houses.forEach(h=>{if(h.lantern)push(h.lantern.x,h.lantern.y,52);[.2,.8].forEach(k=>push(h.x+h.w*k,h.base-h.wallH+28,46,.8));});
    if(!dryVillage())push(MAP.fountain.x,MAP.fountain.y-20,70,.45);
    if(chapterDone&&!P.flags.boss)push(576,40,110,.9);
  }else if(scene.forest){push(FOREST.stone.x,FOREST.stone.y-30,P.flags.boss?70:150);}
  else if(scene.fort){FORT.braziers.forEach(b=>push(b.x,b.y-34,110));if(!P.flags.boss3)push(FORT.altar.x,FORT.altar.y-50,90);push(FORT.well.x,FORT.well.y,40,.4);}
  else if(scene.wadi){push(WADI.spring.x,WADI.spring.y-10,P.flags.gates?120:60,.8);WADI.gates.forEach(g=>push(g.x,150,30,.4));}
  for(const pk of PICKUPS)if(pk.scene===scene.id&&pickupActive(pk))push(pk.x,pk.y-10,40,.9);
  push(hero.x,hero.y-20,70,.75);
  return L;
}
function drawNight(g,cx,cy){
  if(scene.interior)return;
  const n=nightAmount()*(scene.forest?1.05:1),du=duskAmount();
  if(n<.02&&du<.02)return;
  const z=view.zoom,q=OPT.quality==='saver'?.35:.5,w=Math.ceil(view.w*q),h=Math.ceil(view.h*q);
  if(!nightCv)nightCv=document.createElement('canvas');
  if(nightCv.width!==w||nightCv.height!==h){nightCv.width=w;nightCv.height=h;}
  const c=nightCv.getContext('2d');c.globalCompositeOperation='source-over';c.clearRect(0,0,w,h);
  if(du>.02){c.fillStyle=`rgba(255,120,50,${.16*du})`;c.fillRect(0,0,w,h);}
  if(n>.02){
    c.fillStyle=`rgba(10,16,44,${Math.min(.68,n*.68)})`;c.fillRect(0,0,w,h);
    c.globalCompositeOperation='destination-out';
    for(const [x,y,r,a] of sceneLights()){
      const sx=(x-cx)*z*q,sy=(y-cy)*z*q,sr=r*z*q*(.9+.06*Math.sin(time*7+x));
      if(sx<-sr||sy<-sr||sx>w+sr||sy>h+sr)continue;
      const gr=c.createRadialGradient(sx,sy,0,sx,sy,sr);gr.addColorStop(0,`rgba(0,0,0,${.9*a})`);gr.addColorStop(.55,`rgba(0,0,0,${.45*a})`);gr.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=gr;c.fillRect(sx-sr,sy-sr,sr*2,sr*2);
    }
    c.globalCompositeOperation='source-over';
  }
  g.save();g.setTransform(1,0,0,1,0,0);g.imageSmoothingEnabled=true;g.drawImage(nightCv,0,0,canvas.width,canvas.height);
  if(n>.3&&!scene.wadi){ // warm glow on light sources
    g.globalCompositeOperation='lighter';
    for(const [x,y,r,a] of sceneLights()){const sx=(x-cx)*z*view.dpr,sy=(y-cy)*z*view.dpr,sr=r*.5*z*view.dpr;if(sx<-sr||sy<-sr||sx>canvas.width+sr||sy>canvas.height+sr)continue;
      const gr=g.createRadialGradient(sx,sy,0,sx,sy,sr);gr.addColorStop(0,`rgba(255,170,70,${.12*n*a})`);gr.addColorStop(1,'rgba(255,170,70,0)');g.fillStyle=gr;g.fillRect(sx-sr,sy-sr,sr*2,sr*2);}
    g.globalCompositeOperation='source-over';
  }
  if(n>.5&&fxOn()){ // stars over the top edge
    g.fillStyle=`rgba(255,250,220,${.6*n})`;
    for(let i=0;i<18;i++){const sx=((i*137.5+cx*.05)%view.w)*view.dpr,sy=((i*61)%Math.min(120,view.h*.3))*view.dpr,tw=.5+.5*Math.sin(time*2+i);g.globalAlpha=.4+.6*tw;g.fillRect(sx,sy,1.6*view.dpr,1.6*view.dpr);}
    g.globalAlpha=1;
  }
  g.restore();
}
const fxOn=()=>OPT.quality!=='saver';
function waitUntil(hour,label){
  if(state!=='menu')return;
  closeMenu();state='fade';fadeEl.classList.add('on');
  setTimeout(()=>{P.clock=Math.floor(((P.clock??540)-((P.clock??540)%1440))+1440+hour*60);P.hp=null;P.mp=null;P.ally={hp:null,mp:null};fadeEl.classList.remove('on');state='play';showToast('note',label+'<small>استرحت فعادت إليكم الصحة والطاقة</small>',3);saveGame();},700);
}

}

function slotFor(n){
  const S=SCHED[n.id];if(!S)return null;
  const h=hourNow();let pick=S[S.length-1];
  for(const e of S)if(h>=e[0])pick=e;
  if(n===PEDDLER&&Math.floor((P.clock??540)/1440)%2===1)return [0,'none'];
  if((pick[1]==='village'||pick[1]==='wander')&&rainingInVillage()){ // everyone runs home from the rain
    if(n===PEDDLER)return [0,'none'];
    const home=S.filter(e=>INTERIORS[e[1]]).pop();if(home)return [-1,...home.slice(1)];
  }
  return pick;
}
function planRoute(n,slot){
  const wander=slot[1]==='wander',dest=wander?{scene:'village',x:576,y:600}:{scene:slot[1],x:slot[2],y:slot[3]};
  const R=[];
  if(n.scene!=='village'&&n.scene!=='none'&&n.scene!==dest.scene){const h=HOUSE_OF[n.scene];R.push({scene:n.scene,x:224,y:IH-30},{scene:'village',x:h.doorX,y:h.base+16,tp:1});}
  if(n.scene==='none'&&dest.scene!=='none')R.push({scene:'village',x:1120,y:446,tp:1});
  if(dest.scene==='none'){if(n.scene!=='none')R.push({scene:'village',x:1120,y:446},{scene:'none',x:600,y:524,tp:1});}
  else if(dest.scene!=='village'&&dest.scene!==n.scene){const h=HOUSE_OF[dest.scene];R.push({scene:'village',x:h.doorX,y:h.base+16},{scene:dest.scene,x:224,y:IH-40,tp:1},dest);}
  else R.push(dest);
  return R;
}
let lifeReady=false;
function scheduleTick(){
  for(const n of NPCS){
    if(n.scene==='party')continue;
    const slot=slotFor(n);if(!slot)continue;
    const key=slot.join(',');if(n.slotKey===key)continue;
    const first=!lifeReady;n.slotKey=key;
    if(n.id==='hamad'){if(!n.wanderDef)n.wanderDef=n.wander;n.wander=null;}
    n.route=planRoute(n,slot);n.endDir=slot[4]||'down';n.endWander=slot[1]==='wander';
    if(first){for(const w of n.route){n.scene=w.scene;n.x=w.x;n.y=w.y;}n.route=null;finishRoute(n);}
  }
  lifeReady=true;
}
function finishRoute(n){n.route=null;n.moving=false;n.dir=n.endDir||n.dir;if(n.endWander&&n.wanderDef){n.wander=n.wanderDef;n.target=null;n.pause=.5;}}
function walkRoute(n,dt){
  const w=n.route[0];
  if(w.tp||n.scene!==scene.id||w.scene!==n.scene){n.scene=w.scene;n.x=w.x;n.y=w.y;n.route.shift();n.stuck=0;if(!n.route.length)finishRoute(n);return;}
  const dx=w.x-n.x,dy=w.y-n.y,d=Math.hypot(dx,dy);
  if(d<3){n.route.shift();if(!n.route.length)finishRoute(n);return;}
  const step=Math.min(d,44*dt*(rainingInVillage()?1.9:1)),p=resolve(n.x+dx/d*step,n.y+dy/d*step,NPC_R,collidersFor(n),scene.W,scene.H);

  if(moved<step*.3){n.stuck=(n.stuck||0)+dt;if(n.stuck>1.2){n.x=w.x;n.y=w.y;n.stuck=0;}}else n.stuck=0;
}

// الطقس: مطر بعد الظهر مع برق ورعد وبرك ماء، ضباب الصباح، عاصفة رملية في الوادي، وقوس قزح بعد المطر

/* =========================================================
   DAILY WEATHER PLAN
   every game day rolls its own weather from the day number, so it is the
   same after a reload and needs nothing extra in the save
   ========================================================= */
const WX={rain:0,fog:0,sand:0,flash:0,nextBolt:6,lastScene:null,lastClock:0,told:{}};
let wxPlanCache={day:-1};
function wxPlan(day){
  if(wxPlanCache.day===day)return wxPlanCache;
  const R=mulberry(day*7919+13);R();R();
  const p={day};
  const rr=R(),rs=12+R()*4,rd=1.5+R()*2,heavy=.55+R()*.45;
  if(day>=1&&rr<.34)p.rain={a:rs,b:rs+rd,heavy};
  if(R()<.5)p.fog={a:4,b:9};
  const sr=R(),ss=10+R()*3,sd=2+R()*1.5;
  if(sr<.4)p.sand={a:ss,b:ss+sd};
  return wxPlanCache=p;
}
const wxOn=()=>OPT.weather!=='off';
const ramp=(h,a,b,e)=>h<a||h>b?0:Math.min(1,(h-a)/e,(b-h)/e);
function wxNow(){
  const c=P.clock??540,day=Math.floor(c/1440),h=(c%1440)/60,p=wxPlan(day);
  const o={rain:0,fog:0,sand:0,wet:0,bow:0,heavy:p.rain?p.rain.heavy:0};
  if(!wxOn())return o;
  if(p.rain){
    o.rain=ramp(h,p.rain.a,p.rain.b,.3)*(.45+.55*p.rain.heavy);
    o.wet=h<p.rain.a?0:h<p.rain.b?Math.min(1,(h-p.rain.a)/.6):Math.max(0,1-(h-p.rain.b)/2.2);
    if(h>p.rain.b&&h<p.rain.b+1.3&&h<17.6)o.bow=Math.sin((h-p.rain.b)/1.3*Math.PI);
  }
  if(p.fog)o.fog=h<5?Math.max(0,h-4):h<7.5?1:Math.max(0,(9-h)/1.5);
  if(p.sand)o.sand=ramp(h,p.sand.a,p.sand.b,.4);
  return o;
}
const rainingInVillage=()=>wxNow().rain>.12;

/* what each scene shows */
function wxTargets(){
  const n=wxNow(),id=scene.id,open=id==='village'||scene.forest,inside=!!scene.interior;
  return {rain:open||inside?n.rain:0,fog:open?n.fog:0,sand:scene.wadi||scene.fort?n.sand:0,wet:open?n.wet:0,bow:open?n.bow:0,heavy:n.heavy};
}
function weatherTick(dt){
  const T=wxTargets(),c=P.clock??540,snap=WX.lastScene!==scene.id||Math.abs(c-WX.lastClock)>20;
  WX.lastScene=scene.id;WX.lastClock=c;
  const k=snap?1:Math.min(1,dt*.35);
  for(const key of ['rain','fog','sand'])WX[key]+=(T[key]-WX[key])*k;
  WX.wet=T.wet;WX.bow=T.bow;WX.heavy=T.heavy;
  // lightning & thunder in heavy rain
  if(WX.flash>0)WX.flash=Math.max(0,WX.flash-dt*2.4);
  if(WX.rain>.5&&WX.heavy>.75&&(state==='play'||state==='dialog'||state==='battle')){
    WX.nextBolt-=dt;
    if(WX.nextBolt<=0){WX.nextBolt=12+Math.random()*22;if(!scene.interior)WX.flash=1;const far=Math.random();setTimeout(()=>SFX.play('thunder',{vol:scene.interior?.5:1-far*.5}),300+far*1500);}
  }
  wxNotices(T);
}
function wxNotices(T){
  if(state!=='play')return;
  const day=Math.floor((P.clock??540)/1440),say=(kind,html)=>{const key=kind+day;if(WX.told[key])return;WX.told[key]=1;notify(html,3.6);};
  if(T.rain>.1&&!scene.interior)say('rain','بدأ المطر يهطل<small>أهل القرية يحتمون في بيوتهم، وسحر النار أضعف تحت المطر</small>');
  if(T.sand>.15)say('sand','عاصفة رملية!<small>المشي أبطأ، وسحر الرمل أقوى في المعارك</small>');
  if(T.fog>.3)say('fog','ضباب الصباح<small>ينقشع بعد ساعات قليلة</small>');
  if(T.bow>.3&&!scene.interior)say('bow','قوس قزح فوق الوادي');
}
/* gameplay touches */

/* =========================================================
   PUDDLES: they fill while it rains and dry in about two hours
   ========================================================= */

}

/* rain hitting the ground around the camera (stateless, so it costs nothing to keep) */
function drawGroundRain(g,L,T,R2,B2){

/* =========================================================
   SCREEN LAYERS: fog banks, sand clouds, rain streaks, lightning, rainbow
   ========================================================= */
function cloudSheet(seed,col,n){
  const cv=document.createElement('canvas');cv.width=512;cv.height=256;const g=cv.getContext('2d'),R=mulberry(seed);
  for(let i=0;i<n;i++){const x=R()*512,y=R()*256,r=40+R()*70,a=.25+R()*.35;
    for(const ox of [-512,0,512])for(const oy of [-256,0,256]){const gr=g.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,r);gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(x+ox-r,y+oy-r,r*2,r*2);}}
  return cv;
}
let FOGCV=null,SANDCV=null;
function drawSheet(g,cv,ox,oy,scale,alpha){
  const tw=Math.round(512*scale),th=Math.round(256*scale),W=canvas.width,H=canvas.height;
  const x0=Math.round(((ox%tw)+tw)%tw-tw),y0=Math.round(((oy%th)+th)%th-th);g.globalAlpha=alpha;
  for(let y=y0;y<H;y+=th)for(let x=x0;x<W;x+=tw)g.drawImage(cv,x,y,tw,th);

const DROPS=[];
function drawWeatherScreen(g,inBattle){
  const bk=inBattle?.55:1,fo=WX.fog*bk,sa=WX.sand*bk,ra=scene.interior?0:WX.rain,bow=WX.bow;
  if(fo<.02&&sa<.02&&ra<.02&&WX.flash<.02&&bow<.02)return;
  const d=view.dpr,W=canvas.width,H=canvas.height,cam=inBattle?0:view.camX,camY=inBattle?0:view.camY,z=view.zoom,hi=fxOn();
  g.save();g.setTransform(1,0,0,1,0,0);g.imageSmoothingEnabled=true;
  if(bow>.02&&!inBattle){ // a faint arc high over the scene

    const cols=['255,70,70','255,160,60','255,235,90','90,210,110','80,150,255','150,100,230'];

    cols.forEach((c,i)=>{g.strokeStyle=`rgba(${c},${.3*bow*(1-nightAmount())})`;g.lineWidth=6*d;g.beginPath();g.arc(cx,cy,R0-i*6*d,Math.PI*1.15,Math.PI*1.85);g.stroke();});
    g.globalCompositeOperation='source-over';

    g.fillStyle=`rgba(${Math.round(222*lit)},${Math.round(228*lit)},${Math.round(236*lit)},${.22*fo})`;g.fillRect(0,0,W,H);
    if(hi){drawSheet(g,FOGCV,-cam*z*d*.6+time*6*d,-camY*z*d*.6,1.7*d,.55*fo*lit);drawSheet(g,FOGCV,-cam*z*d*1.1-time*10*d+300*d,-camY*z*d*1.1+90*d,2.4*d,.4*fo*lit);}
  }
  if(sa>.02){

    g.stroke();
  }
  if(ra>.02){
    g.fillStyle=`rgba(28,42,58,${.26*ra})`;g.fillRect(0,0,W,H);
    const n=Math.round((hi?170:70)*ra);
    while(DROPS.length<n)DROPS.push({x:Math.random(),y:Math.random(),s:.8+Math.random()*.5,l:.6+Math.random()*.6});
    const wind=.18,lt=(1-nightAmount()*.5);
    g.strokeStyle=`rgba(200,220,240,${.42*lt})`;g.lineWidth=1.1*d;g.beginPath();
    const fall=(H/d)*1.6,dt2=Math.min(.05,time-(drawWeatherScreen.t||time));drawWeatherScreen.t=time;
    for(let i=0;i<n;i++){const p=DROPS[i];p.y+=dt2*p.s*fall/(H/d);p.x+=dt2*p.s*wind*fall/(W/d)*(H/W);
      if(p.y>1){p.y-=1.05;p.x=Math.random();}if(p.x>1)p.x-=1;
      const x=p.x*W,y=p.y*H,l=16*p.l*d;g.moveTo(x,y);g.lineTo(x-l*wind,y-l);}
    g.stroke();
  }
  if(WX.flash>.02){g.fillStyle=`rgba(235,240,255,${.7*WX.flash*WX.flash})`;g.fillRect(0,0,W,H);}
  g.restore();
}

  return `<h3>الإعدادات</h3>${SETS.map(s=>`<div class="set"><div class="grow"><b>${s.name}</b>${s.note?`<div class="muted">${s.note}</div>`:''}</div><div class="seg" role="group" aria-label="${s.name}">${s.opts.map(([v,l])=>`<button type="button" data-opt="${s.k}" data-val="${v}" aria-pressed="${OPT[s.k]===v}">${l}</button>`).join('')}</div></div>`).join('')}
  <div class="set"><div class="grow"><b>تجربة الصوت</b><div class="muted" role="status">${soundMsg||'تُشغّل نغمة قصيرة لتتأكد أن الصوت يعمل.'}</div></div><div class="actions"><button type="button" class="btn" data-act="testsound">تشغيل نغمة</button></div></div>
  <div class="set"><div class="grow"><b>حفظ الرحلة</b><div class="muted" role="status">${saveMsg||'تُحفظ رحلتك تلقائيًا في هذا المتصفح.'}</div></div><div class="actions"><button type="button" class="btn" data-act="save">حفظ الآن</button><button type="button" class="btn ${confirmNew?'warn':'ghost'}" data-act="new">${confirmNew?'تأكيد: مسح التقدم':'رحلة جديدة'}</button></div></div>`;
}
menuEl.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||state!=='menu')return;
  const d=b.dataset;
  if(b.id==='menuClose'){closeMenu();return;}
  if(d.tab){SFX.play('tab');menuTab=d.tab;eqSel=null;confirmNew=false;bagMsg='';saveMsg='';renderMenu(true);menuTabs.querySelector(`[data-tab="${d.tab}"]`)?.focus({preventScroll:true});return;}
  if(d.act!=='new')confirmNew=false;
  if(d.slot){SFX.play('tap');eqSel=eqSel===d.slot?null:d.slot;renderMenu();if(eqSel&&matchMedia('(max-width:700px),(orientation:portrait)').matches)$('pick')?.scrollIntoView({block:'start',behavior:'smooth'});return;}
  if(d.equip){SFX.play(P.eq[eqSel]===d.equip?'tap':'equip');P.eq[eqSel]=d.equip;P.hp=Math.min(curHP(),stat('hp'));P.mp=Math.min(curMP(),stat('mp'));renderMenu();saveGame();return;}
  if(d.unequip){SFX.play('unequip');P.eq[d.unequip]=null;P.hp=Math.min(curHP(),stat('hp'));P.mp=Math.min(curMP(),stat('mp'));renderMenu();saveGame();return;}
  if(d.use){
    const it=ITEMS[d.use];
    if(it.use==='revive'){SFX.play('error');bagMsg='تُستخدم في المعركة فقط، حين يسقط أحد أفراد الفريق.';renderMenu();return;}
    const hpLike=it.use==='hp'||it.use==='cure',ratio=m=>hpLike?mHP(m)/mStat(m,'hp'):mMP(m)/mStat(m,'mp');
    const need=members().filter(m=>ratio(m)<1).sort((x,y)=>ratio(x)-ratio(y));
    if(!need.length){SFX.play('error');bagMsg=hpLike?'صحة الفريق مكتملة، فاحتفظ به لوقت الحاجة.':'طاقة الفريق مكتملة، فاحتفظ بها لوقت الحاجة.';}
    else{const t=need[0];P.inv[d.use]--;if(hpLike)setHP(t,mHP(t)+it.amount);else setMP(t,mMP(t)+it.amount);SFX.play('potion');bagMsg=`استخدمت ${it.name}${t==='aisha'?' على عائشة':''}.`;saveGame();}
    renderMenu();return;
  }
  if(d.opt){
    const was=OPT[d.opt];OPT[d.opt]=d.val;applyOptions();if(d.opt==='sound')SFX.unlock();SFX.play('tap');
    if(d.opt==='quality'&&was!==d.val)resize();
    if(d.opt==='encounters')resetMeter();
    if(d.opt==='hand'||d.opt==='controls')requestAnimationFrame(()=>stickHome(true));
    renderMenu();return;
  }
  if(d.act==='wait'){SFX.play('confirm');waitUntil(+d.h,+d.h===7?'طلع الصباح على عين الوادي':'حلّ الليل على عين الوادي');return;}
  if(d.act==='testsound'){
    if(OPT.sound==='off'){soundMsg='المؤثرات متوقفة. شغّلها من الخيار أعلاه.';renderMenu();return;}
    SFX.test();setTimeout(()=>{const st=SFX.ctx?SFX.ctx.state:'none';soundMsg=st==='running'?'إن لم تسمع النغمة، ارفع صوت الوسائط من أزرار الهاتف.':st==='none'?'هذا المتصفح لا يدعم تشغيل الصوت.':'المتصفح ما زال يحجب الصوت. المس الشاشة ثم جرّب مرة أخرى.';if(state==='menu'&&menuTab==='settings')renderMenu();},350);return;
  }
  if(d.act==='save'){SFX.play('confirm');saveMsg=saveGame()?'حُفظت رحلتك.':'تعذّر الحفظ في هذا المتصفح.';renderMenu();return;}
  if(d.act==='new'){
    if(!confirmNew){SFX.play('error');confirmNew=true;renderMenu();return;}
    menuEl.hidden=true;gameEl.classList.remove('talking');resetWorld();backToTitle();
  }
});
$('menuBtn').addEventListener('click',()=>{if(state==='play')openMenu();});
let lastInputKeyboard=false;
window.addEventListener('pointerdown',()=>{lastInputKeyboard=false;},true);
function backToTitle(){
  state='title';hideToast();gameEl.classList.add('title');
  titleEl.hidden=false;titleEl.classList.remove('leaving');
  continueBtn.hidden=true;startBtn.textContent='ابدأ الرحلة';startBtn.classList.remove('ghost');
}
continueBtn.addEventListener('click',()=>{if(state!=='title'||!savedData)return;applySave(savedData);startGame(true);});

// التشغيل

/* =========================================================
   LOOP & BOOT
   ========================================================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  update(dt);render();drawTransition();SFX.tick(dt);drawMini();
  requestAnimationFrame(frame);
}
function start(data){
  data=data||{};
  Object.assign(OPT,load(OPT_KEY)||{});applyOptions();
  resize();ensureScene(scene);
  view.camX=576-view.w/view.zoom/2;view.camY=430-view.h/view.zoom/2;
  savedData=load(SAVE_KEY);
  if(data.started){applySave(data);startGame(true);titleEl.hidden=true;}
  else if(savedData&&savedData.started){continueBtn.hidden=false;startBtn.textContent='رحلة جديدة';startBtn.classList.add('ghost');}
  updateHud(false);
  requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
}
window.claude?.hot?.snapshot?.(()=>snapshot());
window.__game={get state(){return state;},get scene(){return scene.id;},get target(){return target;},get met(){return met.size;},get quest(){return questStarted;},get chapter(){return chapterDone;},
  hero,keys,NPCS,MAP,SCENES,resolve,act,collidersFor,drawPerson,drawHero,LOOKS,openMenu,closeMenu,stat,heroSpeed,startEncounter,get B(){return B;},FOREST,setChapter(v){chapterDone=v;questStarted=true;syncAisha();},FORT,WADI,get gateSeq(){return gateSeq;},openGate,nightAmount,SFX,WX,wxNow,wxPlan,get P(){return P;},OPT,get toast(){return toastKey;},get view(){return view;},
  step(dt,n=1){for(let i=0;i<n;i++)update(dt);}};
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

})();
